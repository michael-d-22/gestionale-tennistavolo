services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gestionale_tennistavolo
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dati-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/gestionale_tennistavolo
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  dati-mysql:
